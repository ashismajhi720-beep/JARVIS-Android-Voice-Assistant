name: Build Android APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Locate Gradle wrapper
    run: |
      find . -type f -name gradlew

  - name: Build debug APK
    run: |
      chmod +x ./gradlew
      ./gradlew assembleDebug --stacktrace

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: jarvis-app-debug
    
  path: app/build/outputs/apk/debug/app-debug.apk
name: Build Android APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Check project files
    run: |
      pwd
      ls -la
      find . -type f -name gradlew

  - name: Build debug APK
    run: |
      chmod +x ./gradlew
      ./gradlew assembleDebug --stacktrace

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: jarvis-app-debug
      path: app/build/outputs/apk/debug/app-debug.apk